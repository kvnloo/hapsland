name: Road state review demo (offline)

on:
  push:
    branches: [master]
    paths:
      - "examples/road-status-demo/**"
      - ".github/workflows/road-state-demo.yml"
  pull_request:
    paths:
      - "examples/road-status-demo/**"
      - ".github/workflows/road-state-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: road-state-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install only demo tooling (no lifecycle scripts)
        run: npm --prefix examples/road-status-demo install --ignore-scripts --no-audit --no-fund
      - name: Type-contract and deterministic behavior tests
        run: npm --prefix examples/road-status-demo test
      - name: Confirm review selection without sending source
        run: node examples/road-status-demo/scripts/review-matrix.mjs
